services:
  csce231:
    build:
      context: .
    image: csce231-1268
    volumes:
      - .:/csce231
      - ${SSH_AUTH_SOCK}:/ssh-agent
      - ssh-data:/root/.ssh
    environment:
      SSH_AUTH_SOCK: /ssh-agent
    working_dir: /csce231
    stdin_open: true
    tty: true
    security_opt:
      - seccomp=unconfined
    entrypoint: ["/usr/bin/setarch", "-R"]
    command: ["/bin/bash"]

  docs:
    image: csce231-1268
    volumes:
      - .:/csce231
    working_dir: /csce231
    command: python3 -m http.server 8000 --bind 0.0.0.0
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  ssh-data:

